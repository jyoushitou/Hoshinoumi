syntax = "proto3";

package nao.v1;

// v19.2：单用户内部契约骨架。v23 多用户时给请求补 user_id。
message HistoryRequest {
  string target_id = 1;
  string user_id = 2;
  int32 limit = 3;
  int64 before = 4;
}

message ConversationMessage {
  int64 id = 1;
  string user_id = 2;
  string target_id = 3;
  string thread_id = 4;
  string channel = 5;
  string role = 6;
  string content = 7;
  string message_id = 8;
  string meta = 9;
  string created_at = 10;
}

message HistoryReply {
  repeated ConversationMessage messages = 1;
  bool ok = 2;
  string error = 3;
}

message ChatRequest {
  string user_id = 1;
  string target_id = 2;
  string text = 3;
}

message ChatReply {
  string text = 1;
  bool ok = 2;
  string error = 3;
}

message StateRequest {
  string user_id = 1;
}

message StateReply {
  string json = 1;
  bool ok = 2;
}

service Nao {
  rpc History(HistoryRequest) returns (HistoryReply);
  rpc Chat(ChatRequest) returns (ChatReply);
  rpc State(StateRequest) returns (StateReply);
}
