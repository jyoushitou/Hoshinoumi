<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;background:#f8fbff;font:12px -apple-system,"Microsoft YaHei",sans-serif;color:#17263b;overflow:hidden}
.bar{height:26px;background:#fff;border-bottom:1px solid #e3ebf7;display:flex;align-items:center;padding:0 9px;gap:6px;-webkit-app-region:drag}.dot{width:6px;height:6px;border-radius:50%;background:#1e9b6f}.bar b{font-size:10px}.bar small{color:#8a9bb0;font-size:8px}.bar button{margin-left:auto;-webkit-app-region:no-drag;border:0;background:none;color:#8a9bb0;font-size:14px;cursor:pointer}
.body{padding:7px 10px}.row{display:flex;align-items:center;gap:6px}.avatar{width:24px;height:24px;border-radius:7px;background:#dbeafe;display:grid;place-items:center;color:#2563eb;font-weight:700}.bubble{background:#eef4ff;border:1px solid #e3ebf7;border-radius:9px 9px 9px 3px;padding:4px 7px;font-size:9px;line-height:1.45}
.input{display:flex;gap:5px;margin-top:5px}.input input{flex:1;border:1px solid #dbe8ff;border-radius:6px;background:#fff;padding:4px 6px;font:9px inherit;outline:0}.input button,.actions button{border:1px solid #dbe8ff;background:#fff;color:#2563eb;border-radius:6px;padding:3px 6px;font:9px inherit;cursor:pointer}.actions{display:flex;gap:5px;margin-top:5px}.actions .primary{background:#2563eb;color:#fff;border-color:#2563eb}
</style></head><body><div class="bar"><span class="dot"></span><b>奈绪</b><small>迷你窗口</small><button onclick="window.desktopShell.closeMini()">×</button></div><div class="body"><div class="row"><span class="avatar">奈</span><div class="bubble">你回来啦。今天外面有点冷，先喝点热的吧。</div></div><div class="input"><input id="msg" placeholder="和奈绪说点什么…"><button onclick="send()">发送</button></div><div class="actions"><button class="primary" onclick="window.desktopShell.openMain()">打开主窗口</button><button onclick="window.desktopShell.toggleMini()">收起</button></div></div><script>function send(){const i=document.getElementById('msg');if(i.value.trim()){i.value='';i.placeholder='已发送（小窗）'}}</script></body></html>
