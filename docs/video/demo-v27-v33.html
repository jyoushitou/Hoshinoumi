<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoshinoumi v27–v33 · 从注册表到六层接口</title>
<style>
  :root{
    --bg:#060a12; --panel:#0d1627; --text:#edf4ff; --muted:#8fa3bf;
    --pink:#f472b6; --blue:#60a5fa; --cyan:#22d3ee; --green:#4ade80;
    --line:#26344e; --sans:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;
    --mono:"Cascadia Code","Consolas",monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans)}
  #stage{position:fixed;inset:0;overflow:hidden;background:
    radial-gradient(900px 650px at 76% 18%,rgba(37,99,235,.12),transparent 65%),
    radial-gradient(700px 520px at 15% 82%,rgba(219,39,119,.10),transparent 68%),#060a12}
  #stage::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(105deg,rgba(255,255,255,.035),transparent 28%,transparent 72%,rgba(255,255,255,.025));
    animation:breath 5s ease-in-out infinite}
  @keyframes breath{0%,100%{opacity:.45}50%{opacity:1}}
  .scene{position:absolute;inset:0;padding:5.2vh 5.2vw;display:flex;flex-direction:column;justify-content:center;
    background:radial-gradient(1100px 700px at 70% 20%,#16233d,#070b14 72%);animation:sceneIn .45s ease both}
  .scene.light{background:radial-gradient(900px 600px at 86% 10%,#fce7f3 0,transparent 58%),
    radial-gradient(1100px 700px at 15% 20%,#dbeafe,#f8fbff 72%);color:#0b2545}
  @keyframes sceneIn{from{opacity:0;transform:scale(1.008)}to{opacity:1;transform:none}}
  .kicker{font-size:.72vw;letter-spacing:.22em;color:var(--pink);font-weight:800}
  .light .kicker{color:#1d4ed8}
  h1{font-size:5vw;line-height:1.18;margin:1.6vh 0 0;letter-spacing:.01em}
  h1 em{font-style:normal;color:var(--pink)}
  .light h1 em{color:#db2777}
  .lead{font-size:1.03vw;line-height:1.9;color:var(--muted);margin:2.2vh 0 0;max-width:62vw}
  .light .lead{color:#5b7391}
  .chips{display:flex;gap:.7vw;flex-wrap:wrap;margin-top:2.8vh}
  .chip{border:1px solid #2b3a55;background:#0d1729;color:#cbd8ea;border-radius:99px;padding:.65vh 1vw;font-size:.76vw}
  .light .chip{border-color:#93c5fd;background:#fff;color:#1e3a5f}
  .anim{opacity:0;animation:rise .62s cubic-bezier(.2,.8,.25,1) both;animation-delay:var(--d,0s)}
  @keyframes rise{from{opacity:0;transform:translateY(1.5vh)}to{opacity:1;transform:none}}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1vw;margin-top:4vh}
  .grid.two{grid-template-columns:repeat(2,1fr)}
  .grid.three{grid-template-columns:repeat(3,1fr)}
  .card{background:linear-gradient(180deg,#141f34,#0d1627);border:1px solid #2a3a55;border-radius:.9vw;padding:1.7vh 1.15vw;min-height:14vh}
  .light .card{background:#fff;border-color:#c7d9f1;box-shadow:0 10px 28px rgba(30,64,120,.08)}
  .card .v{font-family:var(--mono);font-size:1.7vw;font-weight:800;color:var(--pink)}
  .card .t{font-size:1.05vw;font-weight:800;margin-top:.7vh}
  .card .d{font-size:.7vw;line-height:1.6;color:var(--muted);margin-top:.8vh}
  .light .card .d{color:#5b7391}
  .card.blue .v{color:var(--blue)} .card.cyan .v{color:var(--cyan)} .card.green .v{color:var(--green)}
  .timeline{display:grid;grid-template-columns:repeat(8,1fr);gap:.55vw;margin-top:4vh}
  .tl{border-top:2px solid #2a3a55;padding-top:1.5vh;min-height:12vh}
  .tl.hot{border-top-color:var(--pink)}
  .tl .v{font-family:var(--mono);font-size:1.35vw;font-weight:800;color:#cbd8ea}
  .tl.hot .v{color:var(--pink)}
  .tl .n{font-size:.72vw;color:var(--muted);line-height:1.5;margin-top:.6vh}
  .quote{border-left:3px solid var(--pink);padding:1.5vh 0 1.5vh 1.2vw;margin-top:3.4vh;font-size:1.25vw;line-height:1.7;color:#dce8f8}
  .light .quote{color:#1e3a5f;border-left-color:#db2777}
  .note{border:1px solid #26344e;background:#0d1729;border-radius:.8vw;padding:1.2vh 1.1vw;margin-top:2.4vh;font-size:.82vw;line-height:1.7;color:#b9cbe3}
  .light .note{border-color:#c7d9f1;background:#eff6ff;color:#31506f}
  .code{font-family:var(--mono);font-size:.78vw;color:#93c5fd;background:#0a1220;border:1px solid #22314a;border-radius:.55vw;padding:.9vh .9vw;margin-top:1.8vh;line-height:1.75}
  .light .code{background:#fff;border-color:#c7d9f1;color:#1d4ed8}
  .stageTag{position:absolute;top:3vh;right:5vw;font-family:var(--mono);font-size:.62vw;color:#64748b;letter-spacing:.1em}
  .chapter{position:absolute;top:3vh;left:5.2vw;font-size:.72vw;color:#cbd8ea;letter-spacing:.08em}
  .chapter span{color:#64748b}
  .progress{position:absolute;left:0;right:0;bottom:0;height:3px;background:#0b1322;z-index:20}
  .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--cyan));transition:width .25s linear}
  .subtitle{position:absolute;left:5.2vw;right:5.2vw;bottom:4.2vh;font-size:.86vw;line-height:1.7;color:#a9bdd6;z-index:10}
  .light .subtitle{color:#5b7391}
  .qaTag{display:inline-block;font-family:var(--mono);font-size:.7vw;letter-spacing:.18em;color:var(--cyan);border:1px solid rgba(34,211,238,.45);border-radius:99px;padding:.45vh .9vw;background:rgba(34,211,238,.07)}
  .question{font-size:3.15vw;line-height:1.28;margin:2vh 0 0;max-width:80vw}
  .answer{display:grid;grid-template-columns:1fr 1fr;gap:1.2vw;margin-top:3.4vh}
  .answer .card{min-height:19vh}
  .answer .card .t{font-size:1.2vw}
  .answer .card .d{font-size:.82vw;line-height:1.75}
  .verdict{margin-top:2.6vh;border:1px solid rgba(244,114,182,.55);background:rgba(244,114,182,.07);border-radius:.8vw;padding:1.2vh 1.2vw;font-size:.92vw;line-height:1.65;color:#f6d8ea}
  .light .verdict{background:#fdf2f8;border-color:#f9a8d4;color:#831843}
  .endTitle{font-size:4.2vw;line-height:1.2;margin:0}
  .endTitle em{font-style:normal;color:var(--pink)}
  .meta{display:flex;gap:2vw;margin-top:3.2vh;font-family:var(--mono);font-size:.8vw;color:#7b90ad;flex-wrap:wrap}
  .meta b{color:#cbd8ea;font-weight:700}
  .hint{position:absolute;right:5.2vw;bottom:4.2vh;font-size:.62vw;color:#52637a;z-index:12}
  .pauseBadge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--mono);font-size:1vw;
    color:#cbd8ea;border:1px solid #2a3a55;background:#0d1729;padding:1vh 1.4vw;border-radius:99px;display:none;z-index:30}
</style>
</head>

<div id="stage"></div>
<div class="chapter" id="chapter"></div>
<div class="stageTag">HOSHINOUMI / REC · v27–v33 + FUTURE</div>

<div class="progress"><i id="bar"></i></div>
<script>
const $ = s => document.querySelector(s);
const stage = $("#stage");
const params = new URLSearchParams(location.search);
const startScene = params.get("scene");
let index = 0, timer = null, startedAt = 0, elapsed = 0, paused = false;

const scenes = [
  {
    id:"title", duration:6500, chapter:"00 · 开场",
    sub:"v27–v33：插件从注册表走到六层接口；v34–v37 是下一步。",
    html:`<div class="scene"><div class="kicker anim" style="--d:0s">HOSHINOUMI / REC · v27 → v33</div>
      <h1 class="anim" style="--d:.12s">从注册表，<br>到一套<em>接口层。</em></h1>
      <p class="lead anim" style="--d:.3s">v27 注册表，v28 运行时，v29/v30 模型，v31/v32 记忆，v33 收口六层。<br>
      后面还有 v34 学习规划、v35 多端、v36 生态、v37 运维与嵌入式。</p>
      <div class="chips anim" style="--d:.5s">
        <span class="chip">v33.7.1.1</span><span class="chip">13105 条测试</span>
        <span class="chip">六层接口</span><span class="chip">native 仍是默认</span>
      </div></div>`
  },
  {
    id:"overview", duration:13000, chapter:"01 · 路线",
    sub:"v27–v33 是接口层；v34–v37 才是功能生态和运维。",
    html:`<div class="scene light"><div class="kicker anim" style="--d:0s">01 · 当前路线</div>
      <h1 class="anim" style="--d:.1s;font-size:3.4vw">七个版本，<em>把扩展点铺完</em></h1>
      <div class="grid" style="margin-top:3.4vh">
        <div class="card anim" style="--d:.2s"><div class="v">v27</div><div class="t">注册表</div><div class="d">Manifest / Registry</div></div>
        <div class="card blue anim" style="--d:.3s"><div class="v">v28</div><div class="t">运行时</div><div class="d">权限 / 审批 / stop</div></div>
        <div class="card cyan anim" style="--d:.4s"><div class="v">v29</div><div class="t">模型契约</div><div class="d">Provider / native</div></div>
        <div class="card green anim" style="--d:.5s"><div class="v">v30</div><div class="t">模型插件</div><div class="d">Router / fallback</div></div>
        <div class="card anim" style="--d:.6s"><div class="v">v31</div><div class="t">记忆 native</div><div class="d">Store / Retriever</div></div>
        <div class="card blue anim" style="--d:.7s"><div class="v">v32</div><div class="t">记忆插件</div><div class="d">Router / suffix</div></div>
        <div class="card cyan anim" style="--d:.8s"><div class="v">v33</div><div class="t">六层收口</div><div class="d">Channel → Route</div></div>
        <div class="card green anim" style="--d:.9s"><div class="v">34–37</div><div class="t">未来</div><div class="d">规划 / 多端 / 生态 / 运维</div></div>
      </div>
      <div class="note anim" style="--d:1.05s">核心 native 始终保留；插件是候选，不是默认。默认路由在 v33 的 RouteRegistry。</div>
    </div>`
  },
  {
    id:"v27", duration:12000, chapter:"02 · v27",
    sub:"先有契约和注册表，再谈加载。",
    html:`<div class="scene"><div class="kicker anim" style="--d:0s">02 · v27 · 注册表基础</div>
      <h1 class="anim" style="--d:.1s">插件不是<em>“能 import”</em><br>就算接入。</h1>
      <div class="grid three" style="margin-top:3.8vh">
        <div class="card anim" style="--d:.25s"><div class="v">Manifest</div><div class="t">名字 / 作者 / 层 / 版本</div><div class="d">capability 使用 model.x@1；核心只支持 @1。</div></div>
        <div class="card blue anim" style="--d:.4s"><div class="v">Registry</div><div class="t">内存注册</div><div class="d">同名、同能力同优先级冲突直接拒绝。</div></div>
        <div class="card cyan anim" style="--d:.55s"><div class="v">Master</div><div class="t">5 个注册表</div><div class="d">command → events → life → ai → plugin。</div></div>
      </div>
      <div class="quote anim" style="--d:.8s">核心 native 不实现 PluginManifest，不进入插件表。</div>
    </div>`
  },
  {
    id:"v28", duration:15000, chapter:"03 · v28",
    sub:"安装、审批、权限、错误、stop，一套运行时。",
    html:`<div class="scene light"><div class="kicker anim" style="--d:0s">03 · v28 · 插件运行时</div>
      <h1 class="anim" style="--d:.1s">插件运行时，<br><em>不是 loader 一件事。</em></h1>
      <div class="grid two" style="margin-top:3.4vh">
        <div class="card anim" style="--d:.25s"><div class="v">install</div><div class="t">目录 + manifest + hash</div><div class="d">plugins/&lt;layer&gt;/&lt;name&gt;/；同 hash 幂等，不同 hash 拒绝。</div></div>
        <div class="card blue anim" style="--d:.4s"><div class="v">approve</div><div class="t">pending → enabled</div><div class="d">!plugin install 先待审；批准后才加载。</div></div>
        <div class="card cyan anim" style="--d:.55s"><div class="v">permissions</div><div class="t">0 / 1 / 2</div><div class="d">db 表级、file 路径级、network host 级。</div></div>
        <div class="card green anim" style="--d:.7s"><div class="v">stop</div><div class="t">跟随 worker</div><div class="d">cancel 任务 → stop(5s) → unregister。</div></div>
      </div>
      <div class="note anim" style="--d:.9s">权限默认是“问”，不是“给”；自动停用不自动恢复。</div>
    </div>`
  },
  {
    id:"v29", duration:14000, chapter:"04 · v29",
    sub:"模型契约、native adapter、环境门禁、静默阅读。",
    html:`<div class="scene"><div class="kicker anim" style="--d:0s">04 · v29 · 模型层</div>
      <h1 class="anim" style="--d:.1s">模型可以换，<br><em>调用方式不能乱。</em></h1>
      <div class="grid three" style="margin-top:3.8vh">
        <div class="card anim" style="--d:.25s"><div class="v">ModelProvider</div><div class="t">统一契约</div><div class="d">name / capabilities / complete。</div></div>
        <div class="card blue anim" style="--d:.4s"><div class="v">native</div><div class="t">DeepSeek / 豆包</div><div class="d">核心 native；不注册为插件。</div></div>
        <div class="card cyan anim" style="--d:.55s"><div class="v">env gate</div><div class="t">蓝绿前强制检测</div><div class="d">报告版本/配置/时效不符，拒绝切流。</div></div>
      </div>
      <div class="quote anim" style="--d:.8s">自动阅读只入库；只有 !book next / !book read 才回摘要。</div>
    </div>`
  },
  {
    id:"v30", duration:12000, chapter:"05 · v30",
    sub:"第三方模型 provider 的接入点。",
    html:`<div class="scene light"><div class="kicker anim" style="--d:0s">05 · v30 · 模型插件</div>
      <h1 class="anim" style="--d:.1s">先能接入，<br><em>再谈默认路由。</em></h1>
      <div class="grid two" style="margin-top:3.4vh">
        <div class="card anim" style="--d:.25s"><div class="v">ModelRouter</div><div class="t">model.&lt;name&gt;@1</div><div class="d">从 PluginRegistry 取第三方 provider。</div></div>
        <div class="card blue anim" style="--d:.4s"><div class="v">fallback</div><div class="t">异常 / 无权限 / 停用</div><div class="d">写 plugin_errors，清缓存，回落 native。</div></div>
      </div>
      <div class="code anim" style="--d:.6s">plugin.call → 插件 provider → 失败 → native</div>
      <div class="note anim" style="--d:.8s">v30 只做接入点；默认链路在 v33 的 RouteRegistry。</div>
    </div>`
  },
  {
    id:"v31", duration:14000, chapter:"06 · v31",
    sub:"记忆层契约：Store / Retriever，BM25 仍是 native。",
    html:`<div class="scene"><div class="kicker anim" style="--d:0s">06 · v31 · 记忆 native</div>
      <h1 class="anim" style="--d:.1s">记忆不是<em>一个函数</em><br>是 store + retriever。</h1>
      <div class="grid three" style="margin-top:3.8vh">
        <div class="card anim" style="--d:.25s"><div class="v">MemoryStore</div><div class="t">add / delete / recent</div><div class="d">SQLMemoryStore 包装现有 repo_memory。</div></div>
        <div class="card blue anim" style="--d:.4s"><div class="v">Retriever</div><div class="t">search(query, top_k)</div><div class="d">BM25Retriever 包装现有召回与 RRF。</div></div>
        <div class="card cyan anim" style="--d:.55s"><div class="v">!help</div><div class="t">动态命令帮助</div><div class="d">按分类、单命令详情；不再维护静态列表。</div></div>
      </div>
      <div class="quote anim" style="--d:.8s">所有接口强制 user_id，禁止跨用户。</div>
    </div>`
  },
  {
    id:"v32", duration:14000, chapter:"07 · v32",
    sub:"记忆插件 + 钩子批量修改 + 多行命令。",
    html:`<div class="scene light"><div class="kicker anim" style="--d:0s">07 · v32 · 记忆插件</div>
      <h1 class="anim" style="--d:.1s">插件可以换记忆，<br><em>但不能越权。</em></h1>
      <div class="grid two" style="margin-top:3.2vh">
        <div class="card anim" style="--d:.25s"><div class="v">MemoryRouter</div><div class="t">store / retriever</div><div class="d">插件失败/停用/无权限 → 回落 SQL/BM25。</div></div>
        <div class="card blue anim" style="--d:.4s"><div class="v">cron suffix</div><div class="t">批量追加话术</div><div class="d">“吃饭少吃点”改现有钩子，不新建重复提醒。</div></div>
        <div class="card cyan anim" style="--d:.55s"><div class="v">多行命令</div><div class="t">逐条执行</div><div class="d">首行 ! 才拆分；每行单独回复；上限 10 条。</div></div>
        <div class="card green anim" style="--d:.7s"><div class="v">schema 31</div><div class="t">suffix 列</div><div class="d">迁移幂等；旧库可升级。</div></div>
      </div>
      <div class="note anim" style="--d:.9s">v32 的边界：插件是候选；native 仍是默认。</div>
    </div>`
  },
  {
    id:"v33", duration:20000, chapter:"08 · v33",
    sub:"一次收口六层：通道、工具、存储、调度、出站、默认链路。",
    html:`<div class="scene"><div class="kicker anim" style="--d:0s">08 · v33 · 接口层收口</div>
      <h1 class="anim" style="--d:.1s">六层接口，<br><em>一次收口。</em></h1>
      <div class="grid three" style="margin-top:2.8vh">
        <div class="card anim" style="--d:.2s"><div class="v">Channel</div><div class="t">QQ / NapCat native</div><div class="d">插件通道失败回落 native。</div></div>
        <div class="card blue anim" style="--d:.3s"><div class="v">Tool</div><div class="t">现有工具 native</div><div class="d">越权/超时拒绝。</div></div>
        <div class="card cyan anim" style="--d:.4s"><div class="v">Storage</div><div class="t">MySQL / SQLite native</div><div class="d">插件 DDL 只建 plugin_&lt;name&gt;_*。</div></div>
        <div class="card green anim" style="--d:.5s"><div class="v">Scheduler</div><div class="t">asyncio native</div><div class="d">插件失败回落 native。</div></div>

        <div class="card blue anim" style="--d:.7s"><div class="v">Route</div><div class="t">默认选 native</div><div class="d">!route 解释为什么走 native。</div></div>
      </div>
      <div class="note anim" style="--d:.9s">v33.7.1.1：六层契约、native、插件接入全部完成；13105 条测试，0 失败。</div>
      <div class="quote anim" style="--d:1.05s">插件是候选；默认路由、失败回退、停用回滚都在核心。</div>
    </div>`
  },
  {
    id:"boundary", duration:10000, chapter:"09 · 边界",
    sub:"v27–v33 是接口层，不是把现有功能插件化。",
    html:`<div class="scene light"><div class="kicker anim" style="--d:0s">09 · 边界</div>
      <h1 class="anim" style="--d:.1s">接口层，<br><em>不换核心。</em></h1>
      <div class="grid two" style="margin-top:3.2vh">
        <div class="card anim" style="--d:.25s"><div class="t">核心 native</div><div class="d">DeepSeek、豆包、BM25、NapCat、MySQL/SQLite、asyncio 调度、WebSocket 都保留。</div></div>

  },
  {
    id:"future34", duration:14000, chapter:"10 · FUTURE v34",

function htmlFor(s){ return s.html; }

function show(i){
  index = (i + scenes.length) % scenes.length;
  const s = scenes[index];
  stage.innerHTML = htmlFor(s);
  $("#chapter").innerHTML = s.chapter + " <span>" + fmt(scenes.slice(0,index).reduce((a,x)=>a+x.duration,0)) + "</span>";
  $("#subtitle").textContent = s.sub || "";
  startedAt = performance.now(); elapsed = 0;
  $("#bar").style.width = "0%";
  clearTimeout(timer);
  if (!paused) timer = setTimeout(next, s.duration);
}
function next(){ show(index+1); }
function fmt(ms){ const s=Math.floor(ms/1000); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function tick(){
  if (!paused) elapsed = performance.now()-startedAt;
  const t = scenes[index] ? Math.min(1, elapsed/scenes[index].duration) : 0;
  $("#bar").style.width = (t*100).toFixed(2)+"%";
  requestAnimationFrame(tick);
}
function togglePause(){
  paused = !paused;
  $("#pauseBadge").style.display = paused ? "block" : "none";
  if (paused) clearTimeout(timer);
  else { startedAt = performance.now()-elapsed; timer = setTimeout(next, scenes[index].duration-elapsed); }
}
document.addEventListener("keydown", e => {
  if (e.code === "Space"){ e.preventDefault(); togglePause(); }
  if (e.key === "ArrowRight"){ show(index+1); }
  if (e.key === "ArrowLeft"){ show(index-1); }
});
const startIdx = startScene ? scenes.findIndex(s=>s.id===startScene) : 0;
show(startIdx >= 0 ? startIdx : 0);
tick();
</script>
