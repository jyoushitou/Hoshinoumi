<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoshinoumi v27–v33 · 从注册表到六层接口 + FUTURE v34–v37</title>
<style>
  :root{
    --bg:#060a12; --panel:#0d1627; --text:#edf4ff; --muted:#8fa3bf;
    --pink:#f472b6; --blue:#60a5fa; --cyan:#22d3ee; --green:#4ade80;
    --line:#26344e; --sans:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;
    --mono:"Cascadia Code","Consolas",monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans)}
  #stage{position:fixed;inset:0;overflow:hidden;background:
    radial-gradient(900px 650px at 76% 18%,rgba(37,99,235,.12),transparent 65%),
    radial-gradient(700px 520px at 15% 82%,rgba(219,39,119,.10),transparent 68%),#060a12}
  #stage::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(105deg,rgba(255,255,255,.035),transparent 28%,transparent 72%,rgba(255,255,255,.025));
    animation:breath 5s ease-in-out infinite}
  @keyframes breath{0%,100%{opacity:.45}50%{opacity:1}}
  .scene{position:absolute;inset:0;padding:5.2vh 5.2vw;display:flex;flex-direction:column;justify-content:center;
    background:radial-gradient(1100px 700px at 70% 20%,#16233d,#070b14 72%);animation:sceneIn .45s ease both}
  .scene.light{background:radial-gradient(900px 600px at 86% 10%,#fce7f3 0,transparent 58%),
    radial-gradient(1100px 700px at 15% 20%,#dbeafe,#f8fbff 72%);color:#0b2545}
  @keyframes sceneIn{from{opacity:0;transform:scale(1.008)}to{opacity:1;transform:none}}
  .kicker{font-size:.72vw;letter-spacing:.22em;color:var(--pink);font-weight:800}
  .light .kicker{color:#1d4ed8}
  .scene.light{background:radial-gradient(1100px 700px at 70% 20%,#16233d,#070b14 72%);color:var(--text)}
  h1{font-size:5vw;line-height:1.18;margin:1.6vh 0 0;letter-spacing:.01em}
  h1 em{font-style:normal;color:var(--pink)}
  .light h1 em{color:#db2777}
  .lead{font-size:1.03vw;line-height:1.9;color:var(--muted);margin:2.2vh 0 0;max-width:62vw}
  .light .lead{color:var(--muted)}
  .chips{display:flex;gap:.7vw;flex-wrap:wrap;margin-top:2.8vh}
  .chip{border:1px solid #2b3a55;background:#0d1729;color:#cbd8ea;border-radius:99px;padding:.65vh 1vw;font-size:.76vw}
  .light .chip{border-color:#2b3a55;background:#0d1729;color:#cbd8ea}
  .anim{opacity:0;animation:rise .62s cubic-bezier(.2,.8,.25,1) both;animation-delay:var(--d,0s)}
  @keyframes rise{from{opacity:0;transform:translateY(1.5vh)}to{opacity:1;transform:none}}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1vw;margin-top:4vh}
  .grid.two{grid-template-columns:repeat(2,1fr)}
  .grid.three{grid-template-columns:repeat(3,1fr)}
  .card{background:linear-gradient(180deg,#141f34,#0d1627);border:1px solid #2a3a55;border-radius:.9vw;padding:1.7vh 1.15vw;min-height:14vh}
  .light .card{background:linear-gradient(180deg,#141f34,#0d1627);border-color:#2a3a55;box-shadow:none}
  .card .v{font-family:var(--mono);font-size:1.7vw;font-weight:800;color:var(--pink)}
  .card .t{font-size:1.05vw;font-weight:800;margin-top:.7vh}
  .card .d{font-size:.7vw;line-height:1.6;color:var(--muted);margin-top:.8vh}
  .light .card .d{color:var(--muted)}
  .card.blue .v{color:var(--blue)} .card.cyan .v{color:var(--cyan)} .card.green .v{color:var(--green)}
  .timeline{display:grid;grid-template-columns:repeat(8,1fr);gap:.55vw;margin-top:4vh}
  .tl{border-top:2px solid #2a3a55;padding-top:1.5vh;min-height:12vh}
  .tl.hot{border-top-color:var(--pink)}
  .tl .v{font-family:var(--mono);font-size:1.35vw;font-weight:800;color:#cbd8ea}
  .tl.hot .v{color:var(--pink)}
  .tl .n{font-size:.72vw;color:var(--muted);line-height:1.5;margin-top:.6vh}
  .quote{border-left:3px solid var(--pink);padding:1.5vh 0 1.5vh 1.2vw;margin-top:3.4vh;font-size:1.25vw;line-height:1.7;color:#dce8f8}
  .light .quote{color:#dce8f8;border-left-color:var(--pink)}
  .note{border:1px solid #26344e;background:#0d1729;border-radius:.8vw;padding:1.2vh 1.1vw;margin-top:2.4vh;font-size:.82vw;line-height:1.7;color:#b9cbe3}
  .light .note{border-color:#2a3a55;background:#0d1729;color:#b9cbe3}
  .code{font-family:var(--mono);font-size:.78vw;color:#93c5fd;background:#0a1220;border:1px solid #22314a;border-radius:.55vw;padding:.9vh .9vw;margin-top:1.8vh;line-height:1.75}
  .light .code{background:#0a1220;border-color:#22314a;color:#93c5fd}
  .stageTag{position:absolute;top:3vh;right:5vw;font-family:var(--mono);font-size:.62vw;color:#64748b;letter-spacing:.1em}
  .chapter{position:absolute;top:3vh;left:5.2vw;font-size:.72vw;color:#cbd8ea;letter-spacing:.08em}
  .chapter span{color:#64748b}
  .progress{position:absolute;left:0;right:0;bottom:0;height:3px;background:#0b1322;z-index:20}
  .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--cyan));transition:width .25s linear}
  .subtitle{position:absolute;left:5.2vw;right:5.2vw;bottom:4.2vh;font-size:.86vw;line-height:1.7;color:#a9bdd6;z-index:10}
  .light .subtitle{color:#5b7391}
  .qaTag{display:inline-block;font-family:var(--mono);font-size:.7vw;letter-spacing:.18em;color:var(--cyan);border:1px solid rgba(34,211,238,.45);border-radius:99px;padding:.45vh .9vw;background:rgba(34,211,238,.07)}
  .question{font-size:3.15vw;line-height:1.28;margin:2vh 0 0;max-width:80vw}
  .answer{display:grid;grid-template-columns:1fr 1fr;gap:1.2vw;margin-top:3.4vh}
  .answer .card{min-height:19vh}
  .answer .card .t{font-size:1.2vw}
  .answer .card .d{font-size:.82vw;line-height:1.75}
  .verdict{margin-top:2.6vh;border:1px solid rgba(244,114,182,.55);background:rgba(244,114,182,.07);border-radius:.8vw;padding:1.2vh 1.2vw;font-size:.92vw;line-height:1.65;color:#f6d8ea}
  .light .verdict{background:rgba(244,114,182,.07);border-color:rgba(244,114,182,.55);color:#f6d8ea}
  .endTitle{font-size:4.2vw;line-height:1.2;margin:0}
  .endTitle em{font-style:normal;color:var(--pink)}
  .meta{display:flex;gap:2vw;margin-top:3.2vh;font-family:var(--mono);font-size:.8vw;color:#7b90ad;flex-wrap:wrap}
  .meta b{color:#cbd8ea;font-weight:700}
  .roadmap{display:grid;grid-template-columns:repeat(4,1fr);gap:.9vw;margin-top:2.6vh}
  .roadmap .card{min-height:13vh}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:1.4vw;margin-top:2.8vh}
  .bigNum{font-family:var(--mono);font-size:3.4vw;font-weight:800;color:var(--pink);line-height:1}
  .futureTag{display:inline-block;font-family:var(--mono);font-size:.62vw;letter-spacing:.16em;color:#fbbf24;border:1px solid rgba(251,191,36,.45);border-radius:99px;padding:.35vh .75vw;margin-left:.6vw;vertical-align:middle}
  .mini{font-size:.66vw;line-height:1.6;color:#8fa3bf;margin-top:.6vh}
  .rule{height:1px;background:linear-gradient(90deg,var(--pink),transparent);margin:2.2vh 0 1.2vh}
  .hint{position:absolute;right:5.2vw;bottom:4.2vh;font-size:.62vw;color:#52637a;z-index:12}
  .pauseBadge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--mono);font-size:1vw;
    color:#cbd8ea;border:1px solid #2a3a55;background:#0d1729;padding:1vh 1.4vw;border-radius:99px;display:none;z-index:30}
</style>
</head>

<div id="stage"></div>
<div class="chapter" id="chapter"></div>
<div class="stageTag">HOSHINOUMI / REC · v27–v33 · FUTURE v34–v37</div>

<div class="progress"><i id="bar"></i></div>
<script>
const $ = s => document.querySelector(s);
const stage = $("#stage");
const params = new URLSearchParams(location.search);
const startScene = params.get("scene");
let index = 0, timer = null, startedAt = 0, elapsed = 0, paused = false;

const scenes = [
  {
    id:"title", duration:8000, chapter:"00 · 开场",
    sub:"v27–v33 已完成；v34–v37 是未来规划。",
    html:`<div class="scene"><div class="kicker anim" style="--d:0s">HOSHINOUMI / REC · v27 → v33</div>
      <h1 class="anim" style="--d:.12s">从注册表，<br>到一套<em>可替换的底座。</em></h1>
      <p class="lead anim" style="--d:.3s">v27 契约，v28 运行时，v29/v30 模型，v31/v32 记忆，v33 六层收口。<br>
      v34–v37 把学习、多端、生态和运维接上来。</p>
      <div class="chips anim" style="--d:.5s">
        <span class="chip">v33.7.1.1</span><span class="chip">13105 条测试</span>
        <span class="chip">六层接口</span><span class="chip">native 仍是默认</span>
      </div>
      <div class="foot anim" style="--d:.7s">深色 REC 控制台主题 · 全片无水印外部素材</div></div>`
  },
  {
    id:"roadmap", duration:15000, chapter:"01 · 路线",
    sub:"七个已完成版本；四个未来版本。",
    html:`<div class="scene"><div class="kicker anim" style="--d:0s">01 · 路线图</div>
      <h1 class="anim" style="--d:.1s;font-size:3.4vw">先接口，<em>再生活。</em></h1>
      <div class="roadmap">
        <div class="card anim" style="--d:.2s"><div class="v">v27</div><div class="t">注册表</div><div class="d">Manifest / Registry</div></div>
        <div class="card blue anim" style="--d:.3s"><div class="v">v28</div><div class="t">运行时</div><div class="d">审批 / 权限 / stop</div></div>
        <div class="card cyan anim" style="--d:.4s"><div class="v">v29</div><div class="t">模型契约</div><div class="d">Provider / native</div></div>
        <div class="card green anim" style="--d:.5s"><div class="v">v30</div><div class="t">模型插件</div><div class="d">Router / fallback</div></div>
        <div class="card anim" style="--d:.6s"><div class="v">v31</div><div class="t">记忆 native</div><div class="d">Store / Retriever</div></div>
        <div class="card blue anim" style="--d:.7s"><div class="v">v32</div><div class="t">记忆插件</div><div class="d">Router / suffix</div></div>
        <div class="card cyan anim" style="--d:.8s"><div class="v">v33</div><div class="t">六层收口</div><div class="d">Channel → Route</div></div>
        <div class="card green anim" style="--d:.9s"><div class="v">v34–v37</div><div class="t">FUTURE</div><div class="d">规划 / 多端 / 生态 / 运维</div></div>
      </div>
      <div class="quote anim" style="--d:1.05s">v27–v33 不换核心；v34–v37 才是把能力接到更多入口。</div>
    </div>`
  },
  {
    id:"v27a", duration:14000, chapter:"02 · v27",
    sub:"Manifest 先定义“什么能注册”。",
    html:`<div class="scene"><div class="kicker anim" style="--d:0s">02 · v27 · Manifest</div>
      <h1 class="anim" style="--d:.1s">先写清楚，<br><em>你是谁。</em></h1>
      <div class="grid three" style="margin-top:3vh">
        <div class="card anim" style="--d:.25s"><div class="v">identity</div><div class="t">name / author / layer</div><div class="d">插件身份是 manifest.name；包名不参与判断。</div></div>
        <div class="card blue anim" style="--d:.4s"><div class="v">contract</div><div class="t">version / api_version</div><div class="d">requires_core 只支持 &gt;=x.y.z；核心 API 只支持 @1。</div></div>
        <div class="card cyan anim" style="--d:.55s"><div class="v">capability</div><div class="t">model.x@1</div><div class="d">@2 但核心只有 @1：直接拒绝，不降级。</div></div>
      </div>
      <div class="note anim" style="--d:.75s">核心 native 不实现 PluginManifest，不进入插件表。</div>
    </div>`
  },
  {
    id:"v27b", duration:13000, chapter:"02 · v27",
    sub:"五个注册表，最后才是插件表。",
    html:`<div class="scene"><div class="kicker anim" style="--d:0s">02 · v27 · MasterRegistry</div>
      <h1 class="anim" style="--d:.1s">注册表，<br><em>也有顺序。</em></h1>
      <div class="timeline" style="margin-top:3.6vh">
        <div class="tl hot anim" style="--d:.2s"><div class="v">01</div><div class="n">command</div></div>
        <div class="tl hot anim" style="--d:.3s"><div class="v">02</div><div class="n">events</div></div>
        <div class="tl hot anim" style="--d:.4s"><div class="v">03</div><div class="n">life</div></div>
        <div class="tl hot anim" style="--d:.5s"><div class="v">04</div><div class="n">ai</div></div>
        <div class="tl anim" style="--d:.6s"><div class="v">05</div><div class="n">plugin</div></div>
      </div>
      <div class="quote anim" style="--d:.85s">插件最后初始化；它看到的是已经稳定的前四个快照。</div>
      <div class="note anim" style="--d:1s">同名、同 capability 同 priority 冲突拒绝；不同 priority 允许候选。</div>
    </div>`
  },
  {
    id:"v28a", duration:15000, chapter:"03 · v28",
    sub:"安装不是 import；先目录、hash、pending。",
    html:`<div class="scene"><div class="kicker anim" style="--d:0s">03 · v28 · 安装</div>
      <h1 class="anim" style="--d:.1s">先放进目录，<br><em>再谈启用。</em></h1>
      <div class="grid three" style="margin-top:3vh">
        <div class="card anim" style="--d:.25s"><div class="v">install</div><div class="t">plugins/&lt;layer&gt;/&lt;name&gt;/</div><div class="d">只接受目录包；manifest 校验后才复制。</div></div>
        <div class="card blue anim" style="--d:.4s"><div class="v">hash</div><div class="t">完整性 / 覆盖判断</div><div class="d">同 name 同 hash 幂等；不同 hash 拒绝覆盖。</div></div>
        <div class="card cyan anim" style="--d:.55s"><div class="v">pending</div><div class="t">默认不启用</div><div class="d">!plugin approve 后才进入 enabled。</div></div>
      </div>
      <div class="code anim" style="--d:.75s">!plugin install &lt;dir&gt; → pending → !plugin approve &lt;id&gt;</div>
    </div>`
  },
  {
    id:"v28b", duration:16000, chapter:"03 · v28",
    sub:"权限三档、自动停用、stop 跟随 worker。",
    html:`<div class="scene"><div class="kicker anim" style="--d:0s">03 · v28 · 运行时</div>
      <h1 class="anim" style="--d:.1s">权限，<br><em>不是装饰。</em></h1>
      <div class="grid two" style="margin-top:2.8vh">
        <div class="card anim" style="--d:.25s"><div class="v">0 / 1 / 2</div><div class="t">拒绝 / 审批 / 允许</div><div class="d">默认 1；db 表级、file 路径级、network host 级。</div></div>
        <div class="card blue anim" style="--d:.4s"><div class="v">errors</div><div class="t">连续失败自动停用</div><div class="d">写 plugin_errors；停用不自动恢复；可 auto_start 启动。</div></div>
      </div>
      <div class="code anim" style="--d:.6s">worker stop → cancel tasks → plugin.stop(5s) → unregister</div>
      <div class="note anim" style="--d:.8s">stop 跟随 worker，不跟随 ingress；运行中 disable 立即 stop，下一次 worker 不再加载。</div>
    </div>`
  },
  {
    id:"v29a", duration:16000, chapter:"04 · v29",
    sub:"ModelRequest / ModelReply / ModelProvider。",
    html:`<div class="scene"><div class="kicker anim" style="--d:0s">04 · v29 · 模型契约</div>
      <h1 class="anim" style="--d:.1s">模型可以换，<br><em>调用方式不能乱。</em></h1>
      <div class="grid three" style="margin-top:3vh">
        <div class="card anim" style="--d:.25s"><div class="v">Request</div><div class="t">messages / max_tokens</div><div class="d">target_id 归属、temperature、images 预留。</div></div>
        <div class="card blue anim" style="--d:.4s"><div class="v">Reply</div><div class="t">text / model / tokens</div><div class="d">fallback 标记兜底；业务只依赖接口。</div></div>
        <div class="card cyan anim" style="--d:.55s"><div class="v">Provider</div><div class="t">capabilities / complete</div><div class="d">DeepSeek / 豆包 native 实现，不进插件表。</div></div>
      </div>
      <div class="quote anim" style="--d:.78s">DeepSeek 与豆包仍是核心 native；插件只是候选。</div>
    </div>`
  },
  {
    id:"v29b", duration:16000, chapter:"04 · v29",
    sub:"环境门禁 + 阅读静默：两个容易忽略的边界。",
    html:`<div class="scene"><div class="kicker anim" style="--d:0s">04 · v29 · 边界</div>
      <h1 class="anim" style="--d:.1s">蓝绿之前，<br><em>先过环境。</em></h1>
      <div class="grid two" style="margin-top:2.8vh">
        <div class="card anim" style="--d:.25s"><div class="v">env gate</div><div class="t">env_report 必须新鲜</div><div class="d">version / config_hash / checked_at 不匹配，prepare 和 supervisor 都拒绝。</div></div>
        <div class="card blue anim" style="--d:.4s"><div class="v">reading</div><div class="t">自动流程静默</div><div class="d">idle / 首读只入库；!book next / !book read 才回摘要。</div></div>
      </div>
      <div class="note anim" style="--d:.62s">失败时 current 不动，旧 worker 继续服务；这是门禁，不是重启。</div>
      <div class="quote anim" style="--d:.8s">读到的内容属于记忆，不属于聊天噪音。</div>
    </div>`
  },
  {
    id:"v30", duration:14000, chapter:"05 · v30",
    sub:"model.<name>@1 的接入点，失败/停用回落 native。",
    html:`<div class="scene"><div class="kicker anim" style="--d:0s">05 · v30 · 模型插件</div>
      <h1 class="anim" style="--d:.1s">先能接入，<br><em>再谈默认。</em></h1>
      <div class="grid two" style="margin-top:2.8vh">
        <div class="card anim" style="--d:.25s"><div class="v">ModelRouter</div><div class="t">capability 查找</div><div class="d">registry.get(model.x@1)；没有就 native。</div></div>
        <div class="card blue anim" style="--d:.4s"><div class="v">fallback</div><div class="t">异常 / 无权限 / 停用</div><div class="d">plugin_errors + 缓存失效 + 回退 DeepSeek/豆包。</div></div>

      <div class="note anim" style="--d:.62s">v30 只做接入点；默认链路在 v33 RouteRegistry。</div>
      <div class="quote anim" style="--d:.8s">插件可以失败；核心永远有退路。</div>
    </div>`
  },
  {
    id:"v31a", duration:15000, chapter:"06 · v31",
    sub:"MemoryStore / Retriever；BM25 仍是 native。",
    html:`<div class="scene"><div class="kicker anim" style="--d:0s">06 · v31 · 记忆契约</div>
      <h1 class="anim" style="--d:.1s">记忆不是<em>一个函数。</em></h1>
      <div class="grid two" style="margin-top:2.8vh">
        <div class="card anim" style="--d:.25s"><div class="v">MemoryStore</div><div class="t">add / delete / recent</div><div class="d">SQLMemoryStore 包现有 repo_memory；删除强制 id + user_id。</div></div>

  },
  {
    id:"v31b", duration:13000, chapter:"06 · v31",
    sub:"帮助不再手写：从注册表动态生成。",
    html:`<div class="scene"><div class="kicker anim" style="--d:0s">06 · v31 · 帮助</div>

function htmlFor(s){ return s.html; }

function show(i){
  index = (i + scenes.length) % scenes.length;
  const s = scenes[index];
  stage.innerHTML = htmlFor(s);
  $("#chapter").innerHTML = s.chapter + " <span>" + fmt(scenes.slice(0,index).reduce((a,x)=>a+x.duration,0)) + "</span>";
  $("#subtitle").textContent = s.sub || "";
  startedAt = performance.now(); elapsed = 0;
  $("#bar").style.width = "0%";
  clearTimeout(timer);
  if (!paused) timer = setTimeout(next, s.duration);
}
function next(){ show(index+1); }
function fmt(ms){ const s=Math.floor(ms/1000); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function tick(){
  if (!paused) elapsed = performance.now()-startedAt;
  const t = scenes[index] ? Math.min(1, elapsed/scenes[index].duration) : 0;
  $("#bar").style.width = (t*100).toFixed(2)+"%";
  requestAnimationFrame(tick);
}
function togglePause(){
  paused = !paused;
  $("#pauseBadge").style.display = paused ? "block" : "none";
  if (paused) clearTimeout(timer);
  else { startedAt = performance.now()-elapsed; timer = setTimeout(next, scenes[index].duration-elapsed); }
}
document.addEventListener("keydown", e => {
  if (e.code === "Space"){ e.preventDefault(); togglePause(); }
  if (e.key === "ArrowRight"){ show(index+1); }
  if (e.key === "ArrowLeft"){ show(index-1); }
});
const startIdx = startScene ? scenes.findIndex(s=>s.id===startScene) : 0;
show(startIdx >= 0 ? startIdx : 0);
tick();
</script>
