<body>
<div class="demo-page">

<script>
const app = document.getElementById('view')
let toastTimer = 0

    <div style="display:flex;gap:7px;margin-top:10px"><button class="add-btn" style="flex:1" onclick="toast('导出人设卡演示')">导出</button><button class="add-btn" style="flex:1;background:#fff;color:#2563eb;border:1px solid #dbe8ff" onclick="toast('导入人设卡演示')">导入</button></div>
    <div class="d-card" style="margin-top:9px;font-size:8.5px;color:#8598ad">人设卡切换会更新当前角色；记忆/关系仍复用后端。</div>
  </div>
</div>
${nav('chats')}`

screens.commands = `
<div class="screen-body" style="flex:1;min-height:0;display:flex;flex-direction:column">
  <div class="d-head"><h2>命令<small>COMMANDS</small></h2><div class="act" onclick="toast('命令帮助演示')">?</div></div>
  <div class="d-scroll">
    <div class="cmd-search" onclick="openSearch()">⌕ 搜索命令 / 参数</div>
    <div class="cmd-chips"><button class="on" onclick="selectSeg(this)">全部</button><button onclick="selectSeg(this)">聊天</button><button onclick="selectSeg(this)">记忆</button><button onclick="selectSeg(this)">存钱</button><button onclick="selectSeg(this)">系统</button></div>
    <div class="cmd-row" onclick="openCommand('/help','查看全部命令')"><code>!help</code><div class="t">查看全部命令</div><span class="chev">›</span></div>
    <div class="cmd-row" onclick="openCommand('/memory','按关键词搜索记忆')"><code>!memory</code><div class="t">搜索记忆</div><span class="chev">›</span></div>
    <div class="cmd-row" onclick="openCommand('/savings','记录一笔收支')"><code>!savings</code><div class="t">记录收支</div><span class="chev">›</span></div>
    <div class="cmd-row" onclick="openCommand('/run','执行一个工具')"><code>!run</code><div class="t">执行工具 / 参数</div><span class="chev">›</span></div>
    <div class="cmd-row" onclick="openCommand('/status','查看运行状态')"><code>!status</code><div class="t">运行状态</div><span class="chev">›</span></div>
  </div>
</div>
${nav('chats')}`

screens.cron = `
<div class="screen-body" style="flex:1;min-height:0;display:flex;flex-direction:column">
  <div class="d-head"><h2>定时任务<small>CRON</small></h2><div class="act" onclick="toast('新增定时任务演示')">＋</div></div>
  <div class="d-scroll">
    <div class="cron-row"><div class="t"><b>早安问候</b><small>每天 07:30 · 下次 明天</small></div><div class="switch on" onclick="toggleSwitch(this)"></div></div>
    <div class="cron-row"><div class="t"><b>每周计划提醒</b><small>周日 20:00 · 已启用</small></div><div class="switch on" onclick="toggleSwitch(this)"></div></div>
    <div class="cron-row"><div class="t"><b>猫粮提醒</b><small>每天 18:00 · 已暂停</small></div><div class="switch" onclick="toggleSwitch(this)"></div></div>
    <button class="add-btn" style="margin-top:5px" onclick="toast('立即执行演示')">立即执行一次</button>
  </div>
</div>
${nav('chats')}`

screens.logs = `
<div class="screen-body" style="flex:1;min-height:0;display:flex;flex-direction:column">
  <div class="d-head"><h2>运行日志<small>LOGS</small></h2><div class="act" onclick="toast('日志搜索演示')">⌕</div></div>
  <div class="d-scroll">
    <div class="cmd-chips"><button class="on" onclick="selectSeg(this)">全部</button><button onclick="selectSeg(this)">INFO</button><button onclick="selectSeg(this)">WARN</button><button onclick="selectSeg(this)">ERROR</button></div>
    <div class="log-row"><span class="lv ok">INFO</span><span class="txt">gateway started · 127.0.0.1:27005</span></div>
    <div class="log-row"><span class="lv ok">INFO</span><span class="txt">/api/history 200 · 82ms</span></div>
    <div class="log-row"><span class="lv warn">WARN</span><span class="txt">memory recall empty fallback</span></div>
    <div class="log-row"><span class="lv ok">INFO</span><span class="txt">/api/chat 200 · 1.2s</span></div>
    <div class="log-row"><span class="lv err">ERR</span><span class="txt">weather provider timeout (fallback)</span></div>
    <div class="log-row"><span class="lv ok">INFO</span><span class="txt">weekly plan refreshed</span></div>
  </div>
</div>
${nav('chats')}`

function nav(active){
  const quick = quickKeys.map(k => allEntries.find(e => e[0] === k)).filter(Boolean)
  const tab = ([key,ic,label]) => `<div class="tab ${active===key?'on':''}" onclick="go('${key}')"><span class="ic">${ic}</span>${label}</div>`
  const all = allEntries.map(([key,ic,label]) => `<button class="${active===key?'on':''}" title="${label}" aria-label="${label}" onclick="go('${key}')"><b>${ic}</b></button>`).join('')
  return `<nav class="bottom-nav ${navExpanded?'expanded':''}"><button class="nav-grip" title="展开 / 收起全部入口" aria-label="展开 / 收起全部入口" onclick="toggleNav(event)"><span class="grip-ic">⌃</span></button><div class="nav-row" style="grid-template-columns:repeat(${quick.length},1fr)">${quick.map(tab).join('')}</div><div class="nav-all"><div class="nav-all-grid">${all}</div></div></nav>`
}
function toggleNav(e){
  e.stopPropagation()
  const nav = e.currentTarget.closest('.bottom-nav')
  navExpanded = !navExpanded
  nav.classList.toggle('expanded', navExpanded)
  document.body.classList.toggle('nav-expanded', navExpanded)
}


function go(name){
  currentScreen = name
  if (navExpanded) { navExpanded = false; document.body.classList.remove('nav-expanded') }
  document.querySelector('.demo-overlay')?.remove(); app.innerHTML = screens[name]
  const staleNav = app.querySelector('.bottom-nav')
  if (staleNav) staleNav.outerHTML = nav(name)
  const quickVal = app.querySelector('[data-quick] .val')
  if (quickVal) quickVal.textContent = quickKeys.map(k => allEntries.find(e => e[0] === k)?.[2]).join(' / ')
  if(name==='chats'){ document.querySelectorAll('.conv[data-conv]').forEach(c=>{ if(readConversations.has(c.dataset.conv)) c.querySelectorAll('.badge').forEach(b=>b.remove()) }) } if(name==='chat'){ const input=document.getElementById('input'); if(input) input.style.cssText='flex:1;height:35px;border-radius:10px;background:#f5f8fe;border:1px solid #e6eefb;padding:6px 10px;color:#4a6079;font-size:10px;overflow:auto'; setTimeout(()=>document.getElementById('msgs')?.scrollTo(0,9999),30) } }

function toggleSwitch(el){ el.classList.toggle('on'); toast(el.classList.contains('on')?'已开启演示':'已关闭演示') }

function sendMsg(){
  const input=document.getElementById('input'); if(!input) return
  const text=input.textContent.trim(); if(!text) return
  const msgs=document.getElementById('msgs'); if(!msgs) return
  const me=document.createElement('div'); me.className='msg me'; me.innerHTML=`<div><div class="bubble"></div><div class="stamp">刚刚 · 已读</div></div><div class="avatar sm">你</div>`; me.querySelector('.bubble').textContent=text; msgs.appendChild(me)
  input.textContent=''; msgs.scrollTop=msgs.scrollHeight
  const typing=document.createElement('div'); typing.className='msg'; typing.innerHTML='<div class="avatar bot sm">奈</div><div class="typing"><i></i><i></i><i></i></div>'; msgs.appendChild(typing); msgs.scrollTop=msgs.scrollHeight
  setTimeout(()=>{ typing.remove(); const bot=document.createElement('div'); bot.className='msg'; bot.innerHTML='<div class="avatar bot sm">奈</div><div><div class="bubble">我在听。慢慢说就好。</div><div class="stamp">刚刚</div></div>'; msgs.appendChild(bot); msgs.scrollTop=msgs.scrollHeight }, 900)
}


function overlay(html){
  document.querySelector('.demo-overlay')?.remove()
  const el=document.createElement('div'); el.className='demo-overlay on'
  el.innerHTML=`<div class="overlay-mask" onclick="closeOverlay()"></div>`+html
  document.querySelector('.screen').appendChild(el)
}
function closeOverlay(){ document.querySelector('.demo-overlay')?.remove() }
function openConversation(el, target, name){ el.querySelectorAll('.badge').forEach(b=>b.remove()); readConversations.add(name); go(target) }
function openSearch(){
  overlay(`<div class="search-panel"><div class="row"><input id="q" placeholder="搜索会话 / 记忆 / 命令" autocomplete="off"><button class="cancel" onclick="closeOverlay()">取消</button></div><div id="results"><div class="search-result" onclick="go('chat')">奈绪<small>会话 · 最近消息</small></div><div class="search-result" onclick="go('memory')">不喜欢香菜<small>记忆 · 偏好</small></div><div class="search-result" onclick="go('commands')">!memory<small>命令 · 搜索记忆</small></div></div></div>`)
  const q=document.getElementById('q'); q.focus(); q.oninput=()=>{ const v=q.value.trim(); toast(v?('搜索：'+v+'（演示）'):'输入关键词搜索') }
}
function openChatMenu(){
  overlay(`<div class="sheet"><h4>会话操作</h4><div class="sheet-grid"><button onclick="openSearch()"><b>⌕</b>搜索</button><button onclick="recallLast()"><b>↺</b>撤回</button><button onclick="toast('会话置顶演示')"><b>⇧</b>置顶</button><button onclick="toast('免打扰演示')"><b>◔</b>免打扰</button></div><button class="sheet-close" onclick="closeOverlay()">取消</button></div>`)
}
function openComposerSheet(){
  overlay(`<div class="sheet"><h4>发送内容</h4><div class="sheet-grid"><button onclick="sendImage()"><b>▧</b>图片</button><button onclick="sendVoice()"><b>◉</b>语音</button><button onclick="toast('表情包演示')"><b>☺</b>表情</button><button onclick="toast('文件演示')"><b>⌁</b>文件</button></div><button class="sheet-close" onclick="closeOverlay()">取消</button></div>`)
}
function appendBubble(html){
  const msgs=document.getElementById('msgs'); if(!msgs){ toast('请先进入聊天'); return }
  const me=document.createElement('div'); me.className='msg me'; me.innerHTML=html+`<div class="avatar sm">你</div>`; msgs.appendChild(me); msgs.scrollTop=msgs.scrollHeight; closeOverlay()
}
function sendImage(){ appendBubble(`<div><div class="bubble-image">▧ 图片预览</div><div class="stamp">刚刚 · 已读</div></div>`); toast('图片消息演示') }
function sendVoice(){ appendBubble(`<div><div class="bubble"><div class="bubble-voice"><span class="wave"><i></i><i></i><i></i><i></i><i></i></span> 0:03</div><div class="stamp">刚刚 · 已读</div></div>`); toast('语音消息演示') }
function recallLast(){
  const msgs=document.getElementById('msgs'); if(!msgs){ toast('请先进入聊天'); closeOverlay(); return }
  const own=[...msgs.querySelectorAll('.msg.me')].pop(); if(!own){ toast('没有可撤回的消息'); closeOverlay(); return }
  own.remove(); const note=document.createElement('div'); note.className='system-note'; note.textContent='你撤回了一条消息'; msgs.appendChild(note); closeOverlay(); toast('已撤回（演示）')
}
function openCommand(code,title){
  overlay(`<div class="sheet"><h4>${title}</h4><div class="modal-form"><input value="${code}" readonly><input placeholder="参数（可选）"><button onclick="closeOverlay();toast('命令执行演示')">执行命令</button></div><button class="sheet-close" onclick="closeOverlay()">取消</button></div>`)
}
function openSavingsForm(){
  overlay(`<div class="sheet"><h4>记一笔（演示）</h4><div class="modal-form"><select><option>支出</option><option>收入</option></select><input placeholder="金额（仅主人可见）" inputmode="decimal"><input placeholder="备注"><button onclick="saveSavings()">保存</button></div><button class="sheet-close" onclick="closeOverlay()">取消</button></div>`)
}
function saveSavings(){ closeOverlay(); toast('已记录（演示数据，不提交后端）') }
function selectSeg(el){ [...el.parentElement.children].forEach(x=>x.classList.remove('on')); el.classList.add('on') }
function togglePeriod(el){ el.classList.toggle('on'); toast(el.classList.contains('on')?'节次已启用（演示）':'节次已关闭（演示）') }
function activatePersona(el,name){ [...document.querySelectorAll('.persona-card')].forEach(x=>{x.classList.remove('on'); const e=x.querySelector('em'); if(e) e.textContent='切换'}); el.classList.add('on'); const e=el.querySelector('em'); if(e) e.textContent='使用中'; toast('已切换人设：'+name) }


function saveQuick(){ try { localStorage.setItem('hoshinoumi.quick', JSON.stringify(quickKeys)) } catch {} }
function openQuickSettings(){
  const rows = allEntries.map(([key,ic,label]) => `<button class="quick-choice ${quickKeys.includes(key)?'on':''}" onclick="toggleQuick('${key}')"><b>${ic}</b><span>${label}</span><em>${quickKeys.includes(key)?'✓':''}</em></button>`).join('')
  overlay(`<div class="sheet quick-sheet"><h4>底部快捷栏 <small>${quickKeys.length}/5</small></h4><div class="quick-grid">${rows}</div><button class="sheet-close" onclick="closeQuickSettings()">完成</button><button class="sheet-close" style="margin-top:6px;background:#fff;border:1px solid #dbe8ff" onclick="resetQuick()">恢复默认</button></div>`)
}
function toggleQuick(key){
  const i = quickKeys.indexOf(key)
  if (i >= 0) { if (quickKeys.length <= 1) { toast('至少保留一个快捷入口'); return } quickKeys.splice(i,1) }
  else { if (quickKeys.length >= 5) { toast('最多选择 5 个'); return } quickKeys.push(key) }
  saveQuick(); openQuickSettings()
  const navEl = document.querySelector('.bottom-nav')
  if (navEl) navEl.outerHTML = nav(currentScreen)
}
function resetQuick(){ quickKeys = [...QUICK_DEFAULT]; saveQuick(); openQuickSettings(); const navEl = document.querySelector('.bottom-nav'); if (navEl) navEl.outerHTML = nav(currentScreen) }
function closeQuickSettings(){ closeOverlay(); go(currentScreen) }

const initial = new URLSearchParams(location.search).get('screen')
const fallback = window.innerWidth <= 860 ? 'chats' : 'login'
go(screens[initial] ? initial : fallback)
</script>
