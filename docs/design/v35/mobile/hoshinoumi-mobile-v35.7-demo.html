function setNavExpanded(value){
  navExpanded = value
  document.body.classList.toggle('nav-expanded', navExpanded)
  const nav = document.querySelector('.bottom-nav')
  if (nav) nav.classList.toggle('expanded', navExpanded)
}
function toggleNav(){ setNavExpanded(!navExpanded) }
let navTouchY = null
let navPointerY = null
document.addEventListener('touchstart', e => {
  const nav = e.target.closest && e.target.closest('.bottom-nav')
  navTouchY = nav ? e.touches[0].clientY : null
}, { passive: true })
document.addEventListener('touchend', e => {
  if (navTouchY === null) return
  const nav = document.querySelector('.bottom-nav')
  if (!nav) { navTouchY = null; return }
  const dy = e.changedTouches[0].clientY - navTouchY
  navTouchY = null
  if (dy < -28 && !navExpanded) setNavExpanded(true)
  else if (dy > 28 && navExpanded) setNavExpanded(false)
}, { passive: true })
document.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'mouse') return
  const nav = e.target.closest && e.target.closest('.bottom-nav')
  navPointerY = nav ? e.clientY : null
})
document.addEventListener('pointerup', e => {
  if (navPointerY === null) return
  const nav = document.querySelector('.bottom-nav')
  const dy = e.clientY - navPointerY
  navPointerY = null
  if (!nav) return
  if (dy < -28 && !navExpanded) setNavExpanded(true)
  else if (dy > 28 && navExpanded) setNavExpanded(false)
})

function overlay(html){

function filterMemory(el, tag){
  [...el.parentElement.children].forEach(x => x.classList.remove('on'))
  el.classList.add('on')
  const cards = [...document.querySelectorAll('.mem-card[data-tags]')]
  let visible = 0
  cards.forEach(card => {
    const tags = card.dataset.tags || ''
    const show = tag === '全部' || tags.split(' ').includes(tag)
    card.style.display = show ? '' : 'none'
    if (show) visible++
  })

  if (empty) empty.style.display = visible ? 'none' : ''
}

function openSearch(){

function recallLast(){
  const msgs=document.getElementById('msgs'); if(!msgs){ toast('请先进入聊天'); closeOverlay(); return }
  const own=[...msgs.querySelectorAll('.msg.me')].pop(); if(!own){ toast('没有可撤回的消息'); closeOverlay(); return }
  own.remove(); const note=document.createElement('div'); note.className='system-note'; note.textContent='你撤回了一条消息'; msgs.appendChild(note); closeOverlay(); toast('已撤回（演示）')
}
function filterCommands(q){
  const needle = String(q || '').trim().toLowerCase()
  const active = document.querySelector('#cmdCats .on')?.dataset.cat || 'all'
  let visible = 0
  document.querySelectorAll('.cmd-group').forEach(group => {
    const inCat = active === 'all' || group.dataset.cat === active
    let groupVisible = 0
    group.querySelectorAll('.cmd-item').forEach(item => {
      const hit = !needle || (item.dataset.cmd + ' ' + item.dataset.desc).toLowerCase().includes(needle)
      item.style.display = hit && inCat ? '' : 'none'
      if (hit && inCat) groupVisible++
    })
    group.style.display = groupVisible ? '' : 'none'
    visible += groupVisible
  })
  const empty = document.getElementById('cmdEmpty'); if (empty) empty.style.display = visible ? 'none' : ''
}
function cmdCat(el){
  [...el.parentElement.children].forEach(x => x.classList.remove('on'))

function cashflowData(){return [{m:'2025-12',i:6200,e:4100},{m:'2026-01',i:9800,e:5600},{m:'2026-02',i:7400,e:4800},{m:'2026-03',i:8100,e:6200},{m:'2026-04',i:6900,e:5300},{m:'2026-05',i:8800,e:4900},{m:'2026-06',i:7600,e:5700},{m:'2026-07',i:9100,e:6100},{m:'2026-08',i:8300,e:5200},{m:'2026-09',i:7800,e:5900},{m:'2026-10',i:8600,e:5000},{m:'2026-11',i:8200,e:5430}]}
function cashflowSvg(count){
  const all=cashflowData(), data=count===6?all.slice(-6):all, w=330,h=132,pad={l:25,r:6,t:7,b:18}, iw=w-pad.l-pad.r, ih=h-pad.t-pad.b
  const max=Math.max(...data.map(d=>Math.max(d.i,d.e)),1), step=iw/data.length, bw=Math.max(4,Math.min(9,step*.26))
  let out=''
  for(let g=0;g<=2;g++){const y=pad.t+ih*g/2;out+=`<line class="axis" x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}"/>`}
  data.forEach((d,idx)=>{const x=pad.l+idx*step;const ihh=d.i/max*ih, ehh=d.e/max*ih;out+=`<rect class="bar" x="${x+step/2-bw-1}" y="${pad.t+ih-ihh}" width="${bw}" height="${ihh}" rx="1.5" fill="#60a5fa"/><rect class="bar" x="${x+step/2+1}" y="${pad.t+ih-ehh}" width="${bw}" height="${ehh}" rx="1.5" fill="#fca5a5"/><text x="${x+step/2}" y="${h-5}" text-anchor="middle">${d.m.slice(5)}</text>`})
  const pts=data.map((d,idx)=>`${pad.l+idx*step+step/2},${pad.t+ih-(d.i-d.e)/max*ih}`).join(' ');out+=`<polyline class="netline" points="${pts}"/>`
  return `<svg class="cf-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="每月流水">${out}</svg>`
}

  else { if (quickKeys.length >= 5) { toast('最多选择 5 个'); return } quickKeys.push(key) }
