<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMUI 聊天</title><style>
*{box-sizing:border-box} html,body{margin:0;padding:0;width:390px;height:844px;overflow:hidden;background:#eef2f7;
font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;color:#1c2634}
.phone{width:390px;height:844px;background:#eef2f7;position:relative;overflow:hidden}
.status{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:11px;color:#536174}
.header{height:64px;background:#fff;display:flex;align-items:center;gap:11px;padding:0 18px;border-bottom:1px solid #e3e9f1}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#5b8def,#8a6ff0);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.name{font-size:16px;font-weight:700} .sub{font-size:10px;color:#7a8798;margin-top:2px}
.badge{font-size:10px;background:#e8f0ff;color:#2f6fed;border-radius:20px;padding:3px 8px}
.content{padding:14px 16px;height:calc(844px - 106px - 92px);overflow:hidden}
.smart{background:linear-gradient(135deg,#2f6fed,#5b8def);border-radius:18px;padding:15px;color:#fff;margin-bottom:14px;box-shadow:0 8px 22px rgba(47,111,237,.2)}
.smart .tiny{font-size:10px;opacity:.82} .smart .big{font-size:17px;font-weight:700;margin-top:5px}
.smart .row{display:flex;gap:18px;margin-top:9px;font-size:10px;opacity:.9}
.msg{display:flex;gap:8px;margin-bottom:13px;max-width:92%} .msg.me{margin-left:auto;flex-direction:row-reverse}
.msg .b{background:#fff;border:1px solid #e3e9f1;border-radius:4px 14px 14px 14px;padding:10px 12px;font-size:12px;line-height:1.65;box-shadow:0 2px 6px rgba(28,38,52,.04)}
.msg.me .b{background:#2f6fed;color:#fff;border:0;border-radius:14px 4px 14px 14px}
.meta{font-size:9px;color:#8a96a6;margin-top:4px} .msg.me .meta{text-align:right;color:#6d89b7}
.input{position:absolute;left:14px;right:14px;bottom:16px;height:64px;background:#fff;border:1px solid #dde5ef;border-radius:18px;padding:9px 12px;box-shadow:0 8px 24px rgba(28,38,52,.08)}
.input .tools{font-size:12px;color:#7a8798;display:flex;gap:12px} .input .send{margin-left:auto;background:#2f6fed;color:#fff;border-radius:10px;padding:4px 12px;font-size:10px;font-weight:700}
.input .hint{font-size:11px;color:#9aa6b5;margin-top:8px}
.fab{position:absolute;right:20px;bottom:94px;width:42px;height:42px;border-radius:50%;background:#fff;border:1px solid #dde5ef;display:flex;align-items:center;justify-content:center;color:#2f6fed;font-size:17px;box-shadow:0 6px 18px rgba(28,38,52,.1)}
.tag{position:absolute;left:20px;bottom:96px;font-size:9px;color:#7c8ba0;background:#fff;border:1px solid #e3e9f1;border-radius:20px;padding:5px 9px}
</style></head><body><div class="phone">
<div class="status"><span>21:04</span><span>5G · 86%</span></div>
<div class="header"><div class="avatar">奈</div><div><div class="name">友利奈绪</div><div class="sub">EMUI 6GB · 轻量模式</div></div><div style="margin-left:auto"><span class="badge">● 在线</span></div></div>
<div class="content"><div class="smart"><div class="tiny">她正在</div><div class="big">窗边看书 · 《十日终焉》</div><div class="row"><span>心情 0.72</span><span>精力 0.61</span><span>已读同步</span></div></div>
<div class="msg"><div class="avatar" style="width:30px;height:30px;font-size:12px">奈</div><div><div class="b">你回来啦。今天外面有点冷，先喝点热的吧。</div><div class="meta">20:58 · 已读</div></div></div>
<div class="msg me"><div class="avatar" style="width:30px;height:30px;background:linear-gradient(135deg,#8ad7e8,#7f9cff);font-size:12px">你</div><div><div class="b">刚到家，方案终于过了。</div><div class="meta">21:00 · 已读</div></div></div>
<div class="msg"><div class="avatar" style="width:30px;height:30px;font-size:12px">奈</div><div><div class="b">那很好啊。要不要记进“今天值得高兴的事”？</div><div class="meta">21:01 · 记忆已更新</div></div></div>
<div class="msg"><div class="avatar" style="width:30px;height:30px;font-size:12px">奈</div><div><div class="b">本月结余 ¥3,300，旅行目标 60% 了。</div><div class="meta">21:03 · 仅主人私聊</div></div></div></div>
<div class="input"><div class="tools">＋　相机　图片　语音　<div class="send">发送</div></div><div class="hint">和奈绪说点什么……</div></div>
<div class="fab">⌂</div><div class="tag">服务 / 页面</div>
</div></body></html>
