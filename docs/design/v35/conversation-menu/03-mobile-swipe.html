<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hoshinoumi · 手机左滑菜单</title>
<link rel="stylesheet" href="mock.css">
</head>
<body>
<div class="mobile-page">
  <div class="statusbar"><span>22:00</span><div class="r"><span>▮▮▮ 5G</span><span>97%</span></div></div>
  <div class="mhead"><span class="brandmark"><i></i></span><div><b>HOSHINOUMI</b><small>聊天</small></div><span class="on">在线</span></div>
  <div class="mtitle"><div><h1>聊天</h1><p>QQ 会话 · 3 个</p></div></div>
  <div class="msearch">⌕ 搜索会话 / 记忆 / 命令</div>

  <div class="mlist">
    <div class="mrow">
      <div class="mactions"><button class="ma-mute">免打扰</button><button class="ma-del">删除</button><button class="ma-danger">删人</button></div>
      <div class="mconv swipe"><span class="av p">友</span><div class="cbody"><div class="cname">友利奈绪</div><div class="clast">别磨蹭，早点睡。</div></div><span class="ctm">21:56</span></div>
    </div>
    <div class="mrow">
      <div class="mactions"><button class="ma-mute">免打扰</button><button class="ma-del">删除</button><button class="ma-danger">退群</button></div>
      <div class="mconv"><span class="av g">摄</span><div class="cbody"><div class="cname">摄影社</div><div class="clast">周末外拍集合时间</div></div><span class="ctm">20:41</span></div>
    </div>
    <div class="mrow">
      <div class="mactions"><button class="ma-mute">取消免打扰</button><button class="ma-del">删除</button></div>
      <div class="mconv"><span class="av">8</span><div class="cbody"><div class="cname">82289104</div><div class="clast">在图书馆自习啊</div></div><span class="ctm">19:20</span><span class="muted">静音</span></div>
    </div>
    <div class="mrow">
      <div class="mactions"><button class="ma-mute">免打扰</button><button class="ma-del">删除</button></div>
      <div class="mconv"><span class="av o">周</span><div class="cbody"><div class="cname">周计划提醒</div><div class="clast">第 48 周 · 0 门课</div></div><span class="ctm">昨天</span></div>
    </div>
  </div>

  <div class="mnote">左滑 <b>56px</b> 展开操作栏 · 再点会话关闭</div>
  <div class="mbottom">
    <div class="mtab on"><i>◉</i>聊天</div><div class="mtab"><i>◈</i>记忆</div><div class="mtab"><i>♡</i>关系</div><div class="mtab"><i>⚙</i>设置</div>
  </div>
</div>
</body>
</html>
