<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: https:;">
<title>Hoshinoumi</title>
<style>
:root{color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;padding:0;font-family:var(--vscode-font-family,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif);font-size:var(--vscode-font-size,12px);line-height:1.45;color:var(--vscode-sideBar-foreground,var(--vscode-foreground));background:var(--vscode-sideBar-background);height:100vh;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:1px solid var(--vscode-focusBorder);outline-offset:-1px}
.top{height:35px;flex:none;display:flex;align-items:center;gap:7px;padding:0 12px;border-bottom:1px solid var(--vscode-sideBar-border,var(--vscode-panel-border));background:var(--vscode-sideBarSectionHeader-background,transparent)}
.logo{width:15px;height:15px;color:var(--vscode-textLink-foreground);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.title{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--vscode-sideBarTitle-foreground,var(--vscode-foreground));white-space:nowrap}
.dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--vscode-descriptionForeground,#8a8b82);opacity:.5}
.dot.on{background:var(--vscode-charts-green,#2fa56b);opacity:1}.dot.err{background:var(--vscode-charts-red,#c25b5b);opacity:1}
.nav{flex:none;display:flex;flex-wrap:wrap;gap:1px;padding:5px 7px;border-bottom:1px solid var(--vscode-sideBar-border,var(--vscode-panel-border))}
.nav button{height:23px;padding:0 7px;border-radius:3px;color:var(--vscode-sideBar-foreground);font-size:11px;opacity:.85}
.nav button:hover{background:var(--vscode-list-hoverBackground);opacity:1}
.nav button.on{background:var(--vscode-list-activeSelectionBackground);color:var(--vscode-list-activeSelectionForeground);opacity:1;font-weight:500}
.page{flex:1;min-height:0;overflow:auto;padding:8px 12px}
h1{font-size:13px;font-weight:600;margin:0 0 2px;color:var(--vscode-foreground)}
.sub{font-size:11px;color:var(--vscode-descriptionForeground);margin:0 0 8px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;margin:6px 0}
.stat{border:1px solid var(--vscode-sideBar-border,var(--vscode-panel-border));border-radius:3px;padding:6px 7px;background:var(--vscode-editor-background,transparent)}
.stat .n{font-size:15px;font-weight:600;color:var(--vscode-foreground)}.stat .l{font-size:10px;color:var(--vscode-descriptionForeground);margin-top:1px}
.card{border:0;border-top:1px solid var(--vscode-sideBar-border,var(--vscode-panel-border));border-radius:0;padding:7px 0;margin:0;background:transparent}
.card h3{margin:0 0 3px;font-size:11px;font-weight:600;color:var(--vscode-foreground)}
.row{display:flex;gap:5px;font-size:11px;padding:3px 0;color:var(--vscode-descriptionForeground);border:0;min-height:19px}
.row .r{margin-left:auto;color:var(--vscode-foreground);max-width:65%;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg{display:flex;gap:6px;margin:7px 0;font-size:11px}.msg .a{width:18px;height:18px;border-radius:50%;background:var(--vscode-badge-background);color:var(--vscode-badge-foreground);display:flex;align-items:center;justify-content:center;font-size:9px;flex:none}.msg .b{background:var(--vscode-editor-background);border:1px solid var(--vscode-sideBar-border,transparent);border-radius:4px;padding:5px 7px;line-height:1.5;color:var(--vscode-foreground)}.msg.me{flex-direction:row-reverse}.msg.me .b{background:var(--vscode-list-activeSelectionBackground);border-color:transparent;color:var(--vscode-list-activeSelectionForeground)}
.composer{flex:none;border-top:1px solid var(--vscode-sideBar-border,var(--vscode-panel-border));padding:7px 9px}
.composer textarea{display:block;width:100%;height:44px;resize:none;border:1px solid var(--vscode-input-border,transparent);border-radius:2px;background:var(--vscode-input-background);color:var(--vscode-input-foreground);padding:5px 7px;outline:0;font-size:11px;font-family:inherit}
.composer textarea::placeholder{color:var(--vscode-input-placeholderForeground)}
.sendrow{display:flex;gap:6px;margin-top:5px;align-items:center}.sendrow .hint{font-size:10px;color:var(--vscode-descriptionForeground)}.sendrow button{margin-left:auto;height:24px;padding:0 10px;border-radius:2px;background:var(--vscode-button-background);color:var(--vscode-button-foreground);font-size:11px}.sendrow button:hover{background:var(--vscode-button-hoverBackground)}
.field{margin:5px 0}.field label{display:block;font-size:11px;color:var(--vscode-descriptionForeground);margin-bottom:2px}.field input,.field select{width:100%;height:25px;border:1px solid var(--vscode-input-border,transparent);border-radius:2px;background:var(--vscode-input-background);color:var(--vscode-input-foreground);padding:0 6px;font-size:11px}
.btn{height:25px;border:1px solid var(--vscode-button-border,transparent);border-radius:2px;background:var(--vscode-button-secondaryBackground,transparent);color:var(--vscode-button-secondaryForeground,var(--vscode-foreground));padding:0 9px;font-size:11px;margin:5px 4px 0 0}
.btn:hover{background:var(--vscode-button-secondaryHoverBackground,var(--vscode-list-hoverBackground))}
.btn.primary{background:var(--vscode-button-background);color:var(--vscode-button-foreground)}
.btn.primary:hover{background:var(--vscode-button-hoverBackground)}
.msgline{font-size:10px;color:var(--vscode-descriptionForeground);margin-top:5px;word-break:break-word}
.empty{font-size:11px;color:var(--vscode-descriptionForeground);padding:7px 0}
@media(max-height:520px){.nav{max-height:64px;overflow:auto}}
.cmdout{margin-top:7px;padding:7px;border:1px solid var(--vscode-sideBar-border,#333);border-radius:2px;background:var(--vscode-editor-background,#161616);color:var(--vscode-foreground,#b8c4d0);font:10px/1.55 "Cascadia Code","Consolas",monospace;white-space:pre-wrap;min-height:42px}.setup-mask{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:38px 12px;overflow:auto}.setup-mask.open{display:flex}.setup-card{width:100%;max-width:420px;background:var(--vscode-editor-background,#252526);border:1px solid var(--vscode-panel-border,#454545);border-radius:4px;padding:16px 16px 12px;box-shadow:0 12px 32px rgba(0,0,0,.45);color:var(--vscode-foreground,#ccc)}.setup-title{font-size:15px;font-weight:600;margin-bottom:4px}.setup-sub{font-size:11px;line-height:1.55;color:var(--vscode-descriptionForeground,#999);margin-bottom:12px}.setup-actions{display:flex;gap:6px;margin-top:6px}.setup-actions .btn{flex:1;margin:0}.setup-status{font-size:10px;line-height:1.5;color:var(--vscode-descriptionForeground,#999);margin-top:8px;min-height:15px}.setup-skip{display:block;margin:10px auto 0;font-size:10px;color:var(--vscode-textLink-foreground,#4daafc)}</style>
</head>
<body>
<div class="top"><div class="logo">◈</div><div class="title">Hoshinoumi</div><span class="dot" id="dot"></span></div>
<div class="nav" id="nav">
 <button data-page="chat" class="on">聊天</button><button data-page="memory">记忆</button><button data-page="savings">存钱</button><button data-page="weekly">周计划</button><button data-page="persona">人设</button><button data-page="relation">关系</button><button data-page="settings">设置</button>
</div>
<div class="page" id="page"></div>
<div class="composer" id="composer"><textarea id="msg" placeholder="和 nao 说话…"></textarea><div class="sendrow"><span class="hint">Enter 发送</span><button onclick="sendMsg()">发送</button></div></div>
<div class="setup-mask" id="setupModal">
 <div class="setup-card">
  <div class="setup-title">连接 Hoshinoumi</div>
  <div class="setup-sub">第一次使用，请填写后端地址、访问 token 和主人 QQ。配置只保存在 VS Code 扩展里。</div>
  <div class="field"><label>后端地址</label><input id="setupBase" placeholder="http://127.0.0.1:27004"></div>
  <div class="field"><label>访问 token</label><input id="setupToken" type="password" placeholder="Bearer token"></div>
  <div class="field"><label>主人 QQ</label><input id="setupTarget" placeholder="例如 123456789"></div>
  <div class="setup-actions"><button class="btn" onclick="testSetup()">测试连接</button><button class="btn primary" onclick="saveSetup()">保存并连接</button></div>
  <div class="setup-status" id="setupStatus"></div>
  <button class="setup-skip" onclick="hideSetup()">稍后配置</button>
 </div>
</div>
<script>
const vscode=acquireVsCodeApi();
let seq=0;const pending=new Map();
window.addEventListener('message',e=>{const m=e.data||{};if(m.type!=='hoshinoumi:response')return;const p=pending.get(m.id);if(!p)return;pending.delete(m.id);p({ok:m.status>=200&&m.status<300,status:m.status,data:m.data})});
function api(path,method='GET',body=null){const id=++seq;return new Promise(resolve=>{pending.set(id,resolve);vscode.postMessage({type:'hoshinoumi:request',id,path,method,body:body?JSON.stringify(body):null});setTimeout(()=>{if(!pending.has(id))return;pending.delete(id);resolve({ok:false,status:504,data:{message:'扩展宿主超时'}})},30000)})}
let page='chat',cfg={};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const money=c=>'¥'+((Number(c)||0)/100).toFixed(2);
function setDot(ok,bad){const d=document.getElementById('dot');d.className='dot '+(ok?'on':bad?'err':'')}
function showSetup(){const m=document.getElementById('setupModal');if(!m)return;document.getElementById('setupBase').value=cfg.base_url||'';document.getElementById('setupTarget').value=cfg.target_id||'';document.getElementById('setupStatus').textContent='';m.classList.add('open')}
function hideSetup(){document.getElementById('setupModal')?.classList.remove('open')}
async function testSetup(){const base=document.getElementById('setupBase')?.value.trim();const token=document.getElementById('setupToken')?.value.trim();const target=document.getElementById('setupTarget')?.value.trim();const st=document.getElementById('setupStatus');st.textContent='测试中…';const r=await api('/api/hoshinoumi/test','POST',{base_url:base,token:token||undefined,target_id:target});st.textContent=r.ok?'连接成功 · '+(r.data?.latency_ms||0)+'ms':'连接失败：'+(r.data?.message||r.status);setDot(r.ok,!r.ok)}
async function saveSetup(){const base=document.getElementById('setupBase')?.value.trim();const token=document.getElementById('setupToken')?.value.trim();const target=document.getElementById('setupTarget')?.value.trim();const st=document.getElementById('setupStatus');if(!base||!token||!target){st.textContent='后端地址、token、主人 QQ 都必须填写';return}st.textContent='保存中…';const r=await api('/api/hoshinoumi/config','POST',{base_url:base,token,target_id:target});if(!r.ok){st.textContent='保存失败：'+(r.data?.message||r.status);return}cfg=r.data||{};st.textContent='正在测试连接…';const t=await api('/api/hoshinoumi/test','POST',{});if(t.ok){setDot(true,false);hideSetup();render()}else{setDot(false,true);st.textContent='已保存，但连接失败：'+(t.data?.message||t.status)}}
async function loadConfig(){const r=await api('/api/hoshinoumi/config');cfg=r.data||{};setDot(Boolean(cfg.configured),!cfg.configured);if(!cfg.configured)showSetup();}
async function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.page===page));const p=document.getElementById('page');document.getElementById('composer').style.display=page==='chat'?'block':'none';p.innerHTML='<div class="empty">加载中…</div>';try{if(page==='chat')return renderChat();if(page==='memory')return renderMemory();if(page==='savings')return renderSavings();if(page==='weekly')return renderWeekly();if(page==='persona')return renderPersona();if(page==='relation')return renderRelation();if(page==='commands')return renderCommands();if(page==='settings')return renderSettings()}catch(e){p.innerHTML='<div class="msgline">加载失败：'+esc(e.message)+'</div>'}}
async function renderChat(){const r=await api('/api/hoshinoumi/history?limit=20');const rows=Array.isArray(r.data?.data)?r.data.data:[];setDot(r.ok,r.status>=500);const p=document.getElementById('page');p.innerHTML='<h1>nao</h1><p class="sub">最近 '+rows.length+' 条 · 来自后端</p>'+rows.slice(-20).map(x=>'<div class="msg '+(x.role==='user'?'me':'')+'"><div class="a">'+(x.role==='user'?'你':'奈')+'</div><div class="b">'+esc(x.content||'')+'</div></div>').join('')+(rows.length?'':'<div class="empty">暂无历史</div>')}
async function renderMemory(){const r=await api('/api/hoshinoumi/memory');const d=r.data||{};const t=Array.isArray(d.targets)?d.targets:[];const total=t.reduce((n,x)=>n+Number(x.count||0),0);document.getElementById('page').innerHTML='<h1>记忆</h1><p class="sub">来自后端</p><div class="stats"><div class="stat"><div class="n">'+total+'</div><div class="l">记忆</div></div><div class="stat"><div class="n">'+t.length+'</div><div class="l">会话</div></div></div>'+t.map(x=>'<div class="card"><h3>'+esc(x.target_id)+'</h3><div class="row">'+Number(x.count||0)+' 条<span class="r">'+esc(x.last_message||'')+'</span></div></div>').join('')}
async function renderSavings(){const r=await api('/api/hoshinoumi/savings');const d=r.data||{};const b=await api('/api/hoshinoumi/balance');const bi=(b.data?.balance_infos||[])[0];document.getElementById('page').innerHTML='<h1>存钱</h1><p class="sub">来自后端</p><div class="stats"><div class="stat"><div class="n">'+money(d.total_cents)+'</div><div class="l">总余额</div></div><div class="stat"><div class="n">'+(bi?bi.total_balance:'—')+'</div><div class="l">API 余额</div></div></div>'+(d.accounts||[]).map(a=>'<div class="card"><h3>'+esc(a.account)+'</h3><div class="row">余额<span class="r">'+money(a.balance_cents)+'</span></div></div>').join('')+'<div class="card"><h3>记一笔</h3><div class="field"><label>金额</label><input id="svAmount" type="number" step="0.01" placeholder="35.50"></div><div class="field"><label>账户</label><input id="svAccount" value="银行卡"></div><div class="field"><label>备注</label><input id="svNote"></div><button class="btn primary" onclick="addSaving()">保存</button><div class="msgline" id="svMsg"></div></div><div class="card"><h3>导入流水</h3><div class="field"><label>CSV / JSON</label><input id="savingsFile" type="file" accept=".csv,.json,text/csv,application/json"></div><button class="btn" onclick="importSavings()">预览并导入</button><div class="msgline" id="importMsg"></div></div>'}
async function addSaving(){const amount=document.getElementById('svAmount')?.value;const msg=document.getElementById('svMsg');if(!amount){msg.textContent='先填金额';return}const r=await api('/api/hoshinoumi/savings/entries','POST',{account:document.getElementById('svAccount')?.value||'银行卡',kind:'expense',amount,date:new Date().toISOString().slice(0,10),note:document.getElementById('svNote')?.value||'',ai_visible:true});msg.textContent=r.ok?'已保存':'失败：'+(r.data?.message||r.status);if(r.ok)setTimeout(render,400)}
async function renderWeekly(){const w=Number(localStorage.getItem('hsh_week')||1);const r=await api('/api/hoshinoumi/weekly-plan?week='+w);const d=r.data||{};const rows=Array.isArray(d.courses)?d.courses:[];document.getElementById('page').innerHTML='<h1>周计划表</h1><p class="sub">第 '+w+' 周 · 来自后端</p><div class="field"><label>周次</label><input id="week" type="number" min="1" max="60" value="'+w+'" onchange="localStorage.setItem(\'hsh_week\',this.value);render()"></div>'+(rows.length?rows.map(x=>'<div class="card"><h3>'+esc(x.name)+'</h3><div class="row">'+esc(x.weekday_name||'')+' · '+esc(String(x.period_start||''))+'<span class="r">'+esc(x.location||'')+'</span></div></div>').join(''):'<div class="empty">这一周没有课程</div>')}
async function renderPersona(){const r=await api('/api/hoshinoumi/persona');const rows=Array.isArray(r.data?.data)?r.data.data:[];document.getElementById('page').innerHTML='<h1>人设</h1><p class="sub">只读 · 来自后端</p>'+(rows.length?rows.map(x=>'<div class="card"><h3>'+esc(x.name)+(x.active?' · 当前':'')+'</h3><div class="row">文件<span class="r">'+Object.keys(x.files||{}).filter(k=>x.files[k]).join(' / ')+'</span></div><div class="row">摘要<span class="r">'+esc(x.prompt_excerpt||'')+'</span></div></div>').join(''):'<div class="empty">没有读到人设卡</div>')}
async function renderRelation(){
  const mem=await api('/api/hoshinoumi/memory');
  const targets=Array.isArray(mem.data?.targets)?mem.data.targets:[];
  const saved=localStorage.getItem('hsh_rel_target')||'';
  const current=targets.some(x=>String(x.target_id)===saved)?saved:(targets[0]?String(targets[0].target_id):'');
  const opts=targets.map(x=>'<option value="'+esc(String(x.target_id))+'"'+(String(x.target_id)===current?' selected':'')+'>'+esc(String(x.target_id))+' · '+Number(x.count||0)+' 条</option>').join('');
  document.getElementById('page').innerHTML='<h1>关系</h1><p class="sub">仅 owner 可看全部；普通用户只能看自己</p><div class="field"><label>对象</label><select id="relTarget" onchange="loadRelation(this.value)">'+(opts||'<option value="">主人</option>')+'</select></div><div id="relBody"><div class="empty">加载中…</div></div>';
  await loadRelation(current);
}
async function loadRelation(tid){
  localStorage.setItem('hsh_rel_target',tid||'');
  const body=document.getElementById('relBody');if(!body)return;body.innerHTML='<div class="empty">加载中…</div>';
  const r=await api('/api/hoshinoumi/relation'+(tid?('?target_id='+encodeURIComponent(tid)):''));
  const d=r.data||{};
  if(!r.ok){body.innerHTML='<div class="msgline">加载失败：'+esc(d.message||r.status)+'</div>';return}
  if(d.can_view_all===false){const sel=document.getElementById('relTarget');if(sel){sel.innerHTML='<option>'+esc(d.target_id||'')+' · 仅自己</option>';sel.disabled=true}}
  body.innerHTML='<div class="stats"><div class="stat"><div class="n">'+Number(d.affinity||0).toFixed(2)+'</div><div class="l">亲密度</div></div><div class="stat"><div class="n">'+esc(d.tier||'—')+'</div><div class="l">档位</div></div></div><div class="card"><h3>最近变化</h3>'+((d.events||[]).length?d.events.map(x=>'<div class="row">'+Number(x.delta||0).toFixed(3)+' · '+esc(x.reason||'')+'<span class="r">'+esc(String(x.created_at||'').slice(0,16))+'</span></div>').join(''):'<div class="row">暂无</div>')+'</div>';
}
async function renderSettings(){document.getElementById('page').innerHTML='<h1>设置</h1><p class="sub">保存在 VS Code 扩展 globalState</p><div class="field"><label>后端地址</label><input id="base" value="'+esc(cfg.base_url||'')+'"></div><div class="field"><label>访问 token</label><input id="token" type="password" value="" placeholder="'+(cfg.hasToken?'已保存，留空不修改':'未配置')+'"></div><div class="field"><label>主人 QQ</label><input id="target" value="'+esc(cfg.target_id||'owner')+'"></div><button class="btn" onclick="testConn()">测试连接</button><button class="btn primary" onclick="saveCfg()">保存并连接</button><div class="msgline" id="cfgMsg"></div>'}
async function testConn(){const body={base_url:document.getElementById('base')?.value,token:document.getElementById('token')?.value||undefined,target_id:document.getElementById('target')?.value};const r=await api('/api/hoshinoumi/test','POST',body);const m=document.getElementById('cfgMsg');m.textContent=r.ok?'连接成功 · '+(r.data?.latency_ms||0)+'ms':'连接失败：'+(r.data?.message||r.status);setDot(r.ok,!r.ok)}
async function saveCfg(){const body={base_url:document.getElementById('base')?.value,token:document.getElementById('token')?.value||undefined,target_id:document.getElementById('target')?.value};const r=await api('/api/hoshinoumi/config','POST',body);const m=document.getElementById('cfgMsg');if(!r.ok){m.textContent='保存失败：'+(r.data?.message||r.status);return}cfg=r.data||{};m.textContent='已保存，正在测试…';const t=await api('/api/hoshinoumi/test','POST',{});m.textContent=t.ok?'已连接':'已保存，但连接失败';setDot(t.ok,!t.ok)}
async function sendMsg(){const el=document.getElementById('msg');const text=el.value.trim();if(!text)return;el.value='';const r=await api('/api/hoshinoumi/chat','POST',{message:text,target_id:cfg.target_id||'owner'});if(!r.ok){alert('发送失败：'+(r.data?.message||r.status));return}page='chat';await render()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});
document.getElementById('msg').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg()}});
(async()=>{await loadConfig();await render()})();
</script>
</body>
</html>
