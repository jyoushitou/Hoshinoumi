# Hoshinoumi Web · nginx 生产入口
# 静态：/opt/hoshinoumi/web/dist
# API/WS：127.0.0.1:27015（frpc 映射到公网机的 gateway 27005）
# 公网只开 27006；27004/27005 不对外

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 27006;
    server_name _;
    server_tokens off;

    root /opt/hoshinoumi/web/dist;
    index index.html;
    client_max_body_size 30m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # 静态资源长缓存
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 业务 API → frpc 映射端口（gateway 27005）
    location /api/ {
        proxy_pass http://127.0.0.1:27015;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        add_header Cache-Control "no-store";
    }

    # 拉取/SSE/WebSocket 预留（frpc 映射端口）
    location /ws/ {
        proxy_pass http://127.0.0.1:27015;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # 健康检查
    location = /healthz {
        proxy_pass http://127.0.0.1:27015;
        proxy_set_header Host $host;
    }
    location = /readyz {
        proxy_pass http://127.0.0.1:27015;
        proxy_set_header Host $host;
    }

    # 内部接口绝不暴露
    location /internal/ {
        return 404;
    }
}
